<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Registration - RoadGuard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <i class="fas fa-road"></i> RoadGuard
            </a>
            <nav>
                <ul class="nav-menu" id="nav-menu">
                    <li><a href="index.html" class="nav-link">Home</a></li>
                    <li><a href="citizen-dashboard.html" class="nav-link active">Citizen Portal</a></li>
                    <li><a href="report-pothole.html" class="nav-link">Report Pothole</a></li>
                    <li><a href="track-status.html" class="nav-link">Track Status</a></li>
                    <li><a href="authority-login.html" class="nav-link">Authority Login</a></li>
                    <li><a href="agile-management.html" class="nav-link">Agile PM</a></li>
                    <li><a href="cicd.html" class="nav-link">CI/CD</a></li>
                    <li><a href="about.html" class="nav-link">About</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="hamburger" id="hamburger-menu" aria-label="Toggle Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Auth Card Wrapper -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Citizen Registration</h2>
                <p>Create your citizen account to report potholes and track repair progress.</p>
            </div>

            <form id="citizen-register-form">
                <div class="form-group">
                    <label for="reg-name">Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="aarav@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-phone">Phone Number</label>
                    <input type="tel" id="reg-phone" class="form-control" placeholder="9876543210" pattern="[6-9][0-9]{9}" title="Please enter a valid 10-digit Indian mobile number" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm">Confirm Password</label>
                        <input type="password" id="reg-confirm" class="form-control" placeholder="••••••••" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    <i class="fas fa-user-plus"></i> Register Account
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="citizen-login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <!-- App Scripts -->
    <script src="js/reports.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('citizen-register-form');
            if (form) {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();

                    const name = document.getElementById('reg-name').value.trim();
                    const email = document.getElementById('reg-email').value.trim();
                    const phone = document.getElementById('reg-phone').value.trim();
                    const password = document.getElementById('reg-password').value;
                    const confirm = document.getElementById('reg-confirm').value;

                    // Password Mismatch verification
                    if (password !== confirm) {
                        showToast('Passwords do not match. Please re-type.', 'danger');
                        return;
                    }

                    const res = Auth.registerCitizen(name, email, phone, password);
                    if (res.success) {
                        showToast('Registration successful! Redirecting to dashboard...', 'success');
                        setTimeout(() => {
                            window.location.href = 'citizen-dashboard.html';
                        }, 1200);
                    } else {
                        showToast(res.message, 'danger');
                    }
                });
            }
        });
    </script>
</body>
</html>
